name: 🚀 Deploy Backend to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📡 Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /var/www/roellas-eduTech/eduTech-Backend


            git reset --hard
            git pull origin main

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            npm install --legacy-peer-deps
            pm2 reload eduTechBackend || pm2 start npm --name "eduTechBackend" -- start
            pm2 reload 0

            echo "Deploy Completed Successfully!"